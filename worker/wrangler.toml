name = "qamus-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Create with: npx wrangler kv namespace create QAMUS  — then paste the id here.
# Local `wrangler dev` uses a simulated KV and ignores this id.
[[kv_namespaces]]
binding = "QAMUS"
id = "0935be5a50ed43f5981630d0a8d5ef83"

[vars]
# The GitHub Pages origin of the site (scheme + host, no path, no trailing slash).
ALLOWED_ORIGIN = "https://subhanepix.github.io"

# Per-username write limit (60 a minute), kept out of KV so each sync costs one KV write.
[[ratelimits]]
name = "WRITES"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
