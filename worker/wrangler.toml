name = "qamus-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Create with: npx wrangler kv namespace create QAMUS  — then paste the id here.
# Local `wrangler dev` uses a simulated KV and ignores this id.
[[kv_namespaces]]
binding = "QAMUS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# The GitHub Pages origin of the site (scheme + host, no path, no trailing slash).
ALLOWED_ORIGIN = "https://YOUR-GITHUB-USERNAME.github.io"
