<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Qamus</title>
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qamus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="search-wrap">
    <span class="brand" aria-hidden="true"><span lang="ar">قاموس</span> Qamus</span>
    <button id="back" aria-label="Back" hidden>‹</button>
    <div class="field">
    <input id="q" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="ابحث · word, root (ك ت ب), or English" enterkeyhint="search" dir="auto">
    <kbd class="q-kbd" aria-hidden="true">/</kbd>
    <button id="clear" class="icon-btn" aria-label="Clear" hidden>×</button>
    <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections" hidden>
      <button type="button" class="tab" data-tab="search" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Search</span></button>
      <button type="button" class="tab" data-tab="vocab" aria-label="Vocab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12a.5.5 0 0 1 .5.5v16.2a.3.3 0 0 1-.48.24L12 16l-6.02 4.44a.3.3 0 0 1-.48-.24V4a.5.5 0 0 1 .5-.5z"/></svg><span>Vocab</span><span class="tab-badge" hidden></span></button>
      <button type="button" class="tab" data-tab="history" aria-label="History"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></button>
    </nav>
    <button id="acct" class="acct" type="button" aria-label="Account" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span class="acct-name"></span><span class="dot local"></span>
    </button>
  </div>
</header>
<div class="shell">
  <aside id="side" class="side" aria-label="Recent searches and folders" hidden></aside>
  <main id="main">
    <p id="status" class="muted">Loading dictionary…</p>
  </main>
</div>
<footer id="statusbar" class="statusbar" hidden>
  <span class="stat-sync"><span class="sdot local" id="stat-dot"></span><span id="stat-text">Saved on this device</span></span>
  <span class="stat-keys stat-keys-main" aria-hidden="true"><kbd>/</kbd> search <kbd>Esc</kbd> back <kbd>↑</kbd><kbd>↓</kbd> suggestions</span>
  <span class="stat-keys stat-keys-study" aria-hidden="true"><kbd>Space</kbd> flip <kbd>←</kbd><kbd>→</kbd> move <kbd>1</kbd>–<kbd>4</kbd> mark / grade <kbd>Esc</kbd> leave</span>
</footer>
<script src="merge.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
<script src="vocab.js"></script>
<script src="study.js"></script>
</body>
</html>
